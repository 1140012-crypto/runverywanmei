<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晴空跑者</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:28px 18px;background:#f1f6ef;color:#244638;font-family:system-ui,"Microsoft JhengHei",sans-serif}
h1,p{text-align:center}
h1{margin:0;font-size:36px}
.intro{color:#64806e;line-height:1.8}
.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.5fr);gap:20px}
.card{position:relative;padding:18px;background:white;border:1px solid #dce7dc;border-radius:22px;min-width:0}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-weight:bold}
#pose-status{font-size:12px;font-weight:normal;color:#9a751a}
canvas{display:block;width:100%;height:auto;border-radius:14px;background:#e4eee4}
video{display:none}
.note{font-size:12px;color:#718574;line-height:1.8;text-align:left}
.feet{display:flex;gap:12px;margin-top:12px}
.foot{flex:1;padding:12px;background:#f0f7ef;border-radius:12px;font-size:13px;line-height:1.9}
.foot strong{display:block;font-size:15px}
.up{color:#bd7b14;font-weight:bold}
.down{color:#839287}
.stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;margin-top:12px;background:#184b38;color:#e6f4e7;border-radius:12px;padding:16px}
.stats b{color:#8af2bc}
.controls{max-width:1280px;margin:20px auto 0;background:#fff;border:1px solid #dce7dc;border-radius:20px;padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{border-radius:10px;padding:11px 14px;font:inherit;font-size:13px;max-width:100%}
button{background:#187c55;color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{filter:brightness(1.1)}
select{background:#f3f7f1;color:#365b45;border:1px solid #d6e3d5}
.secondary{background:#e7eee5;color:#365b45}
.stop{background:#b8483f}
#fullscreen-btn{background:#315f78}
button:focus-visible,select:focus-visible{outline:3px solid #e9bb46;outline-offset:3px}
.ranking{margin-top:12px;padding:10px;background:#f9f5e7;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px;text-align:center}
.player-row{font-weight:bold}
.modal{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:22px;background:#143b2ff5;color:white;border-radius:22px;overflow:auto}
.modal.show{display:flex}
.modal h2{color:#f5d565;margin:0}
.modal p{margin:2px}
.final-feet{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;padding:14px;background:#ffffff12;border-radius:12px}
#final-ranking{width:100%;max-width:340px}
#fullscreen-status{font-size:12px;color:#a36a20}
[hidden]{display:none!important}
html:fullscreen{overflow:auto;background:#f1f6ef}
html:-webkit-full-screen{overflow:auto;background:#f1f6ef}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .camera-card{order:2}
  body{padding:20px 10px}
  .card{padding:13px}
  .modal{justify-content:flex-start}
}
</style>
</head>
<body>
<h1>晴空跑者</h1>
<p class="intro" id="instructions">坐著或站著都可以。放下雙腳完成校正後，每抬膝一次前進 0.5 公尺，也可按 A／D 前進。</p>

<div class="layout">
  <section class="card camera-card">
    <div class="heading">
      <span>動作追蹤 · 鏡頭預覽</span>
      <span id="pose-status" role="status">準備鏡頭中...</span>
    </div>
    <video id="webcam" playsinline muted></video>
    <canvas id="pose-canvas" width="480" height="360"></canvas>
    <p class="note">請讓髖部與雙膝入鏡。校正時放下雙腳並保持不動。黃色點代表正在確認，藍色點代表追蹤正常。坐下、站起或換站位後，請按「重新校正」。</p>
  </section>

  <section class="card">
    <div class="heading">SUNNY TRACK ｜ 晴空跑道 · 每格 1 m</div>
    <canvas id="game-canvas" width="960" height="540"></canvas>
    <div class="feet">
      <div class="foot">
        <strong>左腳</strong>抬起次數：<b id="left-count">0</b><br>
        抬起狀態：<span id="left-status" class="down">平放</span>
      </div>
      <div class="foot">
        <strong>右腳</strong>抬起次數：<b id="right-count">0</b><br>
        抬起狀態：<span id="right-status" class="down">平放</span>
      </div>
    </div>
    <div class="stats">
      <span>前進距離：<b id="distance">0.00</b> m</span>
      <span>比賽時間：<b id="time">00:00.0</b></span>
    </div>
    <div id="ranking-panel" class="ranking" hidden>
      <div style="text-align:center">即時名次</div>
      <table><tbody id="ranking-body"></tbody></table>
    </div>
    <div id="result" class="modal">
      <h2>挑戰結束！</h2>
      <p>完賽距離：<span id="final-distance">0.00</span> m</p>
      <p>完賽時間：<span id="final-time">00:00.0</span></p>
      <div class="final-feet">
        <span>左腳：<b id="final-left">0</b> 次</span>
        <span>右腳：<b id="final-right">0</b> 次</span>
      </div>
      <div id="final-ranking" hidden>
        <p>最終名次</p>
        <table>
          <thead><tr><th>名次</th><th>跑者</th></tr></thead>
          <tbody id="final-body"></tbody>
        </table>
      </div>
      <button type="button" onclick="resetGame()">再次挑戰</button>
    </div>
  </section>
</div>

<div class="controls">
  <select id="camera-select" aria-label="攝影機" onchange="startCamera(this.value)">
    <option value="">正在搜尋鏡頭...</option>
  </select>
  <button type="button" class="secondary" onclick="initCamera()">啟用鏡頭</button>
  <select id="mode" aria-label="模式" onchange="changeSettings()">
    <option value="standard">標準模式</option>
    <option value="infinite" selected>無限模式</option>
  </select>
  <select id="limit" aria-label="時間" onchange="changeSettings()">
    <option value="0">時間：不限時</option>
    <option value="30">時間：30 秒</option>
    <option value="300">時間：5 分鐘</option>
  </select>
  <select id="bot-count" aria-label="電腦數量" onchange="changeSettings()">
    <option value="0">電腦：無</option>
    <option value="1">電腦：1 位</option>
    <option value="2">電腦：2 位</option>
    <option value="3">電腦：3 位</option>
  </select>
  <select id="bot1" aria-label="電腦一難度" onchange="changeSettings()" hidden>
    <option value="easy">電腦 1：初級</option>
    <option value="medium" selected>電腦 1：中級</option>
    <option value="hard">電腦 1：高級</option>
  </select>
  <select id="bot2" aria-label="電腦二難度" onchange="changeSettings()" hidden>
    <option value="easy">電腦 2：初級</option>
    <option value="medium">電腦 2：中級</option>
    <option value="hard" selected>電腦 2：高級</option>
  </select>
  <select id="bot3" aria-label="電腦三難度" onchange="changeSettings()" hidden>
    <option value="easy" selected>電腦 3：初級</option>
    <option value="medium">電腦 3：中級</option>
    <option value="hard">電腦 3：高級</option>
  </select>
  <button type="button" class="secondary" onclick="resetTracking()">重新校正</button>
  <button id="fullscreen-btn" type="button" onclick="toggleFullscreen()" aria-pressed="false">⛶ 進入全螢幕</button>
  <button id="start-btn" type="button" onclick="toggleGame()">▶ 開始遊戲</button>
  <button type="button" class="secondary" onclick="resetGame()">重置跑道</button>
  <span id="fullscreen-status" role="status"></span>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const STEP=0.5, MIN_VISIBILITY=0.5, HIP_VISIBILITY=0.35;
const SMOOTH_ALPHA=0.15, MAX_JUMP=0.12, LOST_MS=500;
const CALIBRATION_FRAMES=18, CONFIRM_FRAMES=3;
const gameCanvas=$('game-canvas'), c=gameCanvas.getContext('2d');
const poseCanvas=$('pose-canvas'), pc=poseCanvas.getContext('2d'), video=$('webcam');

let state='READY', position=0, visualPosition=0, elapsed=0, startTime=0;
let infinite=true, timeLimit=0, botCount=0, bots=[];
let counts={left:0,right:0}, keys={a:false,d:false};
let lastStep={left:-Infinity,right:-Infinity};
let footState={left:'DOWN',right:'DOWN'}, pending={left:0,right:0};
let filtered=null, previousRaw=null, lastValid=-Infinity, calibrated=false;
let samples=[], baseline={left:0,right:0};
let stream=null, loopStarted=false, opening=false, cameraVersion=0;
let lastFrame=performance.now(), lastHUD=0, lastRanking=0;

function status(text,color='#9a751a'){
  $('pose-status').textContent=text;
  $('pose-status').style.color=color;
}

function text(id,value){
  const v=String(value);
  if($(id).textContent!==v) $(id).textContent=v;
}

function activeFullscreen(){
  return document.fullscreenElement||document.webkitFullscreenElement;
}

function updateFullscreen(){
  const active=!!activeFullscreen();
  $('fullscreen-btn').textContent=active?'⛶ 退出全螢幕':'⛶ 進入全螢幕';
  $('fullscreen-btn').setAttribute('aria-pressed',String(active));
}

async function toggleFullscreen(){
  text('fullscreen-status','');
  try{
    if(activeFullscreen()){
      const exit=document.exitFullscreen||document.webkitExitFullscreen;
      if(!exit) throw Error('unsupported');
      await exit.call(document);
    }else{
      const root=document.documentElement;
      const enter=root.requestFullscreen||root.webkitRequestFullscreen;
      if(!enter) throw Error('unsupported');
      await enter.call(root);
    }
    updateFullscreen();
  }catch(error){
    text('fullscreen-status','無法切換全螢幕，請使用瀏覽器的全螢幕功能。');
  }
}

document.addEventListener('fullscreenchange',updateFullscreen);
document.addEventListener('webkitfullscreenchange',updateFullscreen);

function recordStep(side){
  if(state!=='RUNNING') return;
  counts[side]++;
  position+=STEP;
  lastStep[side]=performance.now();
}

function footKey(e){
  return e.code==='KeyA'?'a':e.code==='KeyD'?'d':(e.key||'').toLowerCase();
}

document.addEventListener('keydown',e=>{
  const key=footKey(e);
  if(!(key in keys)||e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.isComposing) return;
  if(e.target.closest('input,textarea,[contenteditable]')) return;
  if(state!=='RUNNING'||keys[key]) return;
  e.preventDefault();
  keys[key]=true;
  recordStep(key==='a'?'left':'right');
  updateHUD();
});

document.addEventListener('keyup',e=>{
  const key=footKey(e);
  if(key in keys){
    keys[key]=false;
    updateHUD();
  }
});

window.addEventListener('blur',()=>{
  keys.a=keys.d=false;
  updateHUD();
});

// 追蹤與校正：顯示膝蓋點和判定計步分開處理。
function clearTracking(){
  filtered=null;
  previousRaw=null;
  lastValid=-Infinity;
  calibrated=false;
  samples=[];
  footState={left:'DOWN',right:'DOWN'};
  pending={left:0,right:0};
}

function resetTracking(){
  clearTracking();
  status('請放下雙腳，保持不動進行校正');
}

function validPoint(p,threshold=MIN_VISIBILITY){
  return !!p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&(p.visibility??0)>=threshold;
}

function smoothPoint(old,p){
  const dx=p.x-old.x,dy=p.y-old.y;
  const alpha=Math.hypot(dx,dy)<0.015?0.08:SMOOTH_ALPHA;
  return {x:old.x+dx*alpha,y:old.y+dy*alpha};
}

function unavailable(message){
  pending.left=pending.right=0;
  if(performance.now()-lastValid>LOST_MS) clearTracking();
  status(message);
}

function updateStablePoints(lm){
  if(!lm){
    unavailable('尚未辨識到身體 · 可按 A／D 遊玩');
    return false;
  }

  const raw={
    leftHip:lm[23],rightHip:lm[24],
    leftKnee:lm[25],rightKnee:lm[26]
  };
  const names=Object.keys(raw);

  if(!names.every(name=>validPoint(raw[name],name.includes('Hip')?HIP_VISIBILITY:MIN_VISIBILITY))){
    unavailable('請讓髖部與雙膝入鏡 · 黃色點為確認中');
    return false;
  }

  const now=performance.now();
  if(now-lastValid>LOST_MS) clearTracking();

  if(previousRaw&&names.some(name=>
    Math.hypot(raw[name].x-previousRaw[name].x,raw[name].y-previousRaw[name].y)>MAX_JUMP
  )){
    unavailable('位置跳動，正在重新確認');
    return false;
  }

  const next={};
  names.forEach(name=>{
    next[name]=filtered
      ?smoothPoint(filtered[name],raw[name])
      :{x:raw[name].x,y:raw[name].y};
  });

  filtered=next;
  previousRaw={};
  names.forEach(name=>{
    previousRaw[name]={x:raw[name].x,y:raw[name].y};
  });
  lastValid=now;
  return true;
}

function median(values){
  const s=[...values].sort((a,b)=>a-b),m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}

function calibrate(){
  const p=filtered;
  const sample={
    left:p.leftKnee.y-p.leftHip.y,
    right:p.rightKnee.y-p.rightHip.y
  };

  if(samples.length){
    const first=samples[0];
    if(Math.abs(sample.left-first.left)>0.02||Math.abs(sample.right-first.right)>0.02){
      samples=[];
    }
  }

  samples.push(sample);
  status(`放下雙腳校正中 ${samples.length}/${CALIBRATION_FRAMES}`);
  if(samples.length<CALIBRATION_FRAMES) return;

  ['left','right'].forEach(name=>{
    baseline[name]=median(samples.map(p=>p[name]));
  });

  calibrated=true;
  status('校正完成 · 追蹤正常','#16825e');
}

function confirmFoot(side,lift,raise,release){
  const old=footState[side];
  const change=old==='DOWN'?lift>raise:lift<release;
  pending[side]=change?pending[side]+1:0;

  if(pending[side]>=CONFIRM_FRAMES){
    footState[side]=old==='DOWN'?'UP':'DOWN';
    pending[side]=0;
    if(footState[side]==='UP') recordStep(side);
  }
}

function detectLegLift(){
  if(!calibrated){
    calibrate();
    return;
  }

  // 坐姿與站姿都使用各腳校正後的膝、髖相對高度。
  const p=filtered;
  const left=p.leftKnee.y-p.leftHip.y;
  const right=p.rightKnee.y-p.rightHip.y;

  confirmFoot('left',baseline.left-left,0.025,0.012);
  confirmFoot('right',baseline.right-right,0.025,0.012);

  if(
    footState.left==='DOWN'&&footState.right==='DOWN'&&
    Math.abs(left-baseline.left)<0.012&&
    Math.abs(right-baseline.right)<0.012
  ){
    baseline.left+=(left-baseline.left)*0.01;
    baseline.right+=(right-baseline.right)*0.01;
  }
  status('追蹤正常','#16825e');
}

function drawPoint(p,label,color,raised=false){
  const x=p.x*poseCanvas.width,y=p.y*poseCanvas.height;
  pc.beginPath();
  pc.arc(x,y,raised?17:11,0,Math.PI*2);
  pc.fillStyle=color+'33';
  pc.fill();
  pc.lineWidth=3;
  pc.strokeStyle=color;
  pc.stroke();
  pc.save();
  pc.translate(x,y-22);
  pc.scale(-1,1);
  pc.fillStyle=color;
  pc.font='bold 14px system-ui';
  pc.textAlign='center';
  pc.fillText(label,0,0);
  pc.restore();
}

function onPoseResults(results){
  const w=poseCanvas.width,h=poseCanvas.height,lm=results.poseLandmarks;
  pc.save();
  pc.clearRect(0,0,w,h);
  pc.translate(w,0);
  pc.scale(-1,1);
  if(results.image) pc.drawImage(results.image,0,0,w,h);

  if(updateStablePoints(lm)){
    detectLegLift();
    ['left','right'].forEach(side=>{
      const raised=calibrated&&footState[side]==='UP';
      const label=(side==='left'?'左膝':'右膝')+(raised?' ↑':'');
      const color=calibrated?(raised?'#facc15':'#38bdf8'):'#facc15';
      drawPoint(filtered[side+'Knee'],label,color,raised);
    });
  }else if(lm){
    // 髖部不清楚時仍顯示可辨識的膝蓋，提示點不計步。
    if(validPoint(lm[25],0.35)) drawPoint(lm[25],'左膝（確認中）','#facc15');
    if(validPoint(lm[26],0.35)) drawPoint(lm[26],'右膝（確認中）','#facc15');
  }

  pc.restore();
}

const pose=typeof Pose==='undefined'?null:new Pose({
  locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

if(pose){
  pose.setOptions({
    modelComplexity:1,
    smoothLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
  });
  pose.onResults(onPoseResults);
}

async function initCamera(){
  if(opening) return;
  if(!pose){
    status('追蹤模型未載入 · 請確認網路或按 A／D 遊玩');
    return;
  }

  opening=true;
  try{
    const temporary=await navigator.mediaDevices.getUserMedia({video:true});
    temporary.getTracks().forEach(track=>track.stop());
    const cameras=(await navigator.mediaDevices.enumerateDevices())
      .filter(d=>d.kind==='videoinput');

    $('camera-select').replaceChildren();
    cameras.forEach((d,i)=>{
      const o=document.createElement('option');
      o.value=d.deviceId;
      o.textContent=d.label||`攝影機 ${i+1}`;
      $('camera-select').appendChild(o);
    });

    if(!cameras.length) throw Error('no camera');
    await startCamera(cameras[0].deviceId);
  }catch(error){
    status('鏡頭未啟用 · 請允許攝影機，或按 A／D 遊玩');
  }finally{
    opening=false;
  }
}

async function startCamera(deviceId){
  if(!pose) return;
  const version=++cameraVersion;
  status('鏡頭開啟中...');
  clearTracking();

  if(stream) stream.getTracks().forEach(track=>track.stop());

  try{
    const v={width:{ideal:640},height:{ideal:480}};
    if(deviceId) v.deviceId={exact:deviceId};

    const next=await navigator.mediaDevices.getUserMedia({video:v});
    if(version!==cameraVersion){
      next.getTracks().forEach(track=>track.stop());
      return;
    }

    stream=next;
    video.srcObject=next;
    await video.play();
    resetTracking();

    if(!loopStarted){
      loopStarted=true;
      detectFrameLoop();
    }
  }catch(error){
    if(version===cameraVersion) status('鏡頭無法開啟 · 可按 A／D 遊玩');
  }
}

async function detectFrameLoop(){
  try{
    if(video.readyState>=2&&!video.paused&&!video.ended){
      await pose.send({image:video});
    }
  }catch(error){
    unavailable('追蹤暫時失敗 · 請確認網路後重新啟用鏡頭');
  }
  requestAnimationFrame(detectFrameLoop);
}

// 電腦對戰
function speedRange(diff){
  return diff==='hard'?[2,2.8]:diff==='medium'?[1.2,1.8]:[0.5,1];
}

function initBots(){
  bots=[];
  if(!infinite) return;
  const colors=['#f87171','#fb923c','#facc15'],lanes=[-0.3,-0.05,0.3];

  for(let i=0;i<botCount;i++){
    const difficulty=$('bot'+(i+1)).value;
    const [min,max]=speedRange(difficulty);
    const speed=min+Math.random()*(max-min);
    bots.push({
      name:'電腦 '+(i+1),id:i+1,difficulty,pos:0,speed,
      target:speed,timer:0,color:colors[i],lane:lanes[i]
    });
  }
}

function updateBots(dt){
  bots.forEach(bot=>{
    bot.timer-=dt;
    if(bot.timer<=0){
      const [min,max]=speedRange(bot.difficulty);
      bot.target=min+Math.random()*(max-min);
      bot.timer=0.5+Math.random()*1.5;
    }
    bot.speed+=(bot.target-bot.speed)*(1-Math.exp(-3*dt));
    bot.pos+=bot.speed*dt;
  });
}

function ranking(){
  return [
    {name:'你（玩家）',pos:position,player:true,color:'#16825e'},
    ...bots.map(b=>({name:b.name,pos:b.pos,player:false,color:b.color}))
  ].sort((a,b)=>b.pos-a.pos);
}

function fillRanking(id){
  const body=$(id);
  body.replaceChildren();
  ranking().forEach((runner,i)=>{
    const row=document.createElement('tr');
    row.className=runner.player?'player-row':'';
    const rank=document.createElement('td'),name=document.createElement('td');
    rank.textContent='第 '+(i+1)+' 名';
    name.textContent=runner.name;
    name.style.color=runner.color;
    row.append(rank,name);
    body.appendChild(row);
  });
}

function formatTime(seconds){
  const t=Math.floor(Math.max(0,seconds)*10);
  return String(Math.floor(t/600)).padStart(2,'0')+':'+
    String(Math.floor(t/10)%60).padStart(2,'0')+'.'+t%10;
}

function updateHUD(){
  text('distance',position.toFixed(2));
  text('left-count',counts.left);
  text('right-count',counts.right);
  const fresh=calibrated&&performance.now()-lastValid<=LOST_MS;

  ['left','right'].forEach(side=>{
    const raised=keys[side==='left'?'a':'d']||(fresh&&footState[side]==='UP');
    text(side+'-status',raised?'抬起 ↑':'平放');
    $(side+'-status').className=raised?'up':'down';
  });

  text('time',infinite&&timeLimit>0
    ?formatTime(Math.max(0,timeLimit-elapsed))+'（倒數）'
    :formatTime(elapsed));
  $('ranking-panel').hidden=bots.length===0;
}

function changeSettings(){
  infinite=$('mode').value==='infinite';
  timeLimit=Number($('limit').value);
  botCount=Number($('bot-count').value);
  $('limit').hidden=$('bot-count').hidden=!infinite;
  for(let i=1;i<=3;i++) $('bot'+i).hidden=!infinite||botCount<i;
  resetGame();
}

function resetGame(){
  state='READY';
  position=visualPosition=elapsed=0;
  counts={left:0,right:0};
  keys.a=keys.d=false;
  lastStep={left:-Infinity,right:-Infinity};
  clearTracking();
  initBots();
  $('result').classList.remove('show');
  text('start-btn','▶ 開始遊戲');
  $('start-btn').classList.remove('stop');
  if(stream) status('請放下雙腳，等待校正');
  fillRanking('ranking-body');
  updateHUD();
}

function toggleGame(){
  if(state==='RUNNING'){
    advanceGame(performance.now());
    if(state==='RUNNING') finishRun();
    return;
  }

  resetGame();
  startTime=performance.now();
  lastFrame=startTime;
  state='RUNNING';
  text('start-btn','🏁 結束並結算');
  $('start-btn').classList.add('stop');
}

function finishRun(){
  if(state!=='RUNNING') return;
  state='FINISHED';
  keys.a=keys.d=false;
  footState.left=footState.right='DOWN';
  text('final-distance',position.toFixed(2));
  text('final-time',formatTime(elapsed));
  text('final-left',counts.left);
  text('final-right',counts.right);
  $('final-ranking').hidden=bots.length===0;
  fillRanking('final-body');
  fillRanking('ranking-body');
  $('result').classList.add('show');
  text('start-btn','▶ 開始遊戲');
  $('start-btn').classList.remove('stop');
  updateHUD();
}

function advanceGame(now){
  const next=(now-startTime)/1000,limited=infinite&&timeLimit>0;
  const effective=limited?Math.min(next,timeLimit):next;
  updateBots(Math.max(0,effective-elapsed));
  elapsed=effective;
  if(limited&&elapsed>=timeLimit) finishRun();
}

// 跑者與戶外跑道
function drawRunner(x,y,scale,color,label,leftLift,rightLift){
  c.save();
  c.translate(x,y);
  c.scale(scale,scale);
  c.lineCap='round';
  c.lineJoin='round';

  c.fillStyle='#193a3b28';
  c.beginPath();
  c.ellipse(0,2,18,5,0,0,Math.PI*2);
  c.fill();

  function limb(points,col,width){
    c.strokeStyle=col;
    c.lineWidth=width;
    c.beginPath();
    points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));
    c.stroke();
  }

  function leg(side,lift){
    const hip=[side*5,-29];
    const knee=[side*(7+lift),-15-lift*7];
    const foot=[side*(8+lift*2),-1-lift*15];
    limb([hip,knee],'#253f50',8);
    limb([knee,foot],'#dfab87',5.5);
    limb([[foot[0]-3,foot[1]],[foot[0]+4,foot[1]+1]],'#fff8e6',5);
  }

  function arm(side,lift){
    limb([[side*10,-53],[side*16,-40-lift*2],[side*11,-44-lift*7]],'#dfab87',5);
  }

  leg(-1,leftLift);
  leg(1,rightLift);
  arm(-1,rightLift);
  arm(1,leftLift);

  c.fillStyle=color;
  c.beginPath();
  c.moveTo(-11,-55);
  c.quadraticCurveTo(0,-59,11,-55);
  c.lineTo(8,-30);
  c.lineTo(-8,-30);
  c.closePath();
  c.fill();

  c.fillStyle='#263f50';
  c.fillRect(-8,-31,16,7);
  c.fillStyle='#fff5dd';
  c.fillRect(-5,-48,10,11);
  c.fillStyle='#244f43';
  c.textAlign='center';
  c.font='bold 8px system-ui';
  c.fillText('1',0,-40);
  limb([[0,-55],[0,-60]],'#d9a27e',6);

  c.fillStyle='#dfa987';
  c.beginPath();
  c.ellipse(0,-66,8.5,10,0,0,Math.PI*2);
  c.fill();
  c.fillStyle='#263b34';
  c.beginPath();
  c.ellipse(0,-69,8.5,7,0,0,Math.PI*2);
  c.fill();

  c.fillStyle='#fff';
  c.font='bold 12px system-ui';
  c.shadowColor='#173d34';
  c.shadowBlur=4;
  c.fillText(label,0,-85);
  c.restore();
}

function renderTrack(now,dt){
  const w=gameCanvas.width,h=gameCanvas.height;
  const hy=h*0.38,cx=w/2,top=38,bottom=w*0.84;
  visualPosition+=(position-visualPosition)*(1-Math.exp(-10*dt));

  const sky=c.createLinearGradient(0,0,0,hy);
  sky.addColorStop(0,'#88cee6');
  sky.addColorStop(1,'#e0f2e5');
  c.fillStyle=sky;
  c.fillRect(0,0,w,h);

  c.fillStyle='#fff1b0';
  c.beginPath();
  c.arc(w*0.79,h*0.16,33,0,Math.PI*2);
  c.fill();

  for(let i=0;i<5;i++){
    c.fillStyle='#ffffffaa';
    c.beginPath();
    c.ellipse((i*211+95)%w,65+i%2*37,65,12,0,0,Math.PI*2);
    c.fill();
  }

  for(let layer=0;layer<2;layer++){
    c.fillStyle=layer?'#70a895':'#a4c5b7';
    c.beginPath();
    c.moveTo(0,hy+30);
    for(let x=0;x<=w;x+=40){
      c.lineTo(x,hy-35-layer*12-Math.sin(x*0.012+layer*2)*22);
    }
    c.lineTo(w,hy+40);
    c.closePath();
    c.fill();
  }

  const grass=c.createLinearGradient(0,hy,0,h);
  grass.addColorStop(0,'#99bc78');
  grass.addColorStop(1,'#4e8b62');
  c.fillStyle=grass;
  c.fillRect(0,hy,w,h-hy);

  for(let i=0;i<4;i++){
    const l=-0.5+i*0.25,r=l+0.25;
    c.beginPath();
    c.moveTo(cx+top*l,hy);
    c.lineTo(cx+top*r,hy);
    c.lineTo(cx+bottom*r,h);
    c.lineTo(cx+bottom*l,h);
    c.closePath();
    c.fillStyle=i%2?'#cd785c':'#d98668';
    c.fill();
  }

  for(let i=0;i<=4;i++){
    const o=-0.5+i*0.25;
    c.beginPath();
    c.moveTo(cx+top*o,hy);
    c.lineTo(cx+bottom*o,h);
    c.strokeStyle='#fff6df';
    c.lineWidth=i===0||i===4?5:2;
    c.stroke();
  }

  for(let m=Math.max(0,Math.floor(visualPosition)-1);m<visualPosition+45;m++){
    const d=m-visualPosition;
    if(d< -1) continue;
    const p=1/(1+(d+1)*0.16),y=hy+(h-hy)*p,tw=top+(bottom-top)*p;
    c.beginPath();
    c.moveTo(cx-tw/2,y);
    c.lineTo(cx+tw/2,y);
    c.strokeStyle=m%5===0?'#fff1ccbb':'#ffffff35';
    c.lineWidth=m%5===0?3:1;
    c.stroke();

    if(m%5===0){
      c.fillStyle='#fff9df';
      c.font=`bold ${Math.max(11,18*p)}px system-ui`;
      c.textAlign='right';
      c.fillText(m+' m',cx-tw/2-10,y);
    }

    if(m===0){
      for(let j=0;j<24;j++){
        c.fillStyle=j%2?'#31453f':'#fff';
        c.fillRect(cx-tw/2+j*tw/24,y-6*p,tw/24,12*p);
      }
    }
  }

  const runners=[
    {pos:position,player:true},
    ...bots.map(bot=>({pos:bot.pos,bot}))
  ].sort((a,b)=>b.pos-a.pos);
  const fresh=calibrated&&now-lastValid<=LOST_MS;

  for(const r of runners){
    if(r.player){
      const l=state==='RUNNING'&&(keys.a||(fresh&&footState.left==='UP')||now-lastStep.left<220);
      const rr=state==='RUNNING'&&(keys.d||(fresh&&footState.right==='UP')||now-lastStep.right<220);
      drawRunner(cx+(bots.length?bottom*0.125:0),h-70,1.35,'#176954','你',l?1:0,rr?1:0);
    }else{
      const d=r.pos-visualPosition;
      if(d< -2||d>40) continue;
      const p=Math.min(1.2,1/(1+d*0.12)),tw=top+(bottom-top)*p;
      const swing=state==='RUNNING'?Math.sin(now*0.012+r.bot.id):0;
      drawRunner(
        cx+r.bot.lane*tw,hy+(h-70-hy)*p,Math.max(0.25,p)*1.2,
        r.bot.color,r.bot.name,Math.max(0,swing),Math.max(0,-swing)
      );
    }
  }

  if(state==='READY'){
    c.fillStyle='#164c3de0';
    c.fillRect(cx-168,hy-53,336,42);
    c.fillStyle='#fff';
    c.textAlign='center';
    c.font='bold 17px system-ui';
    c.fillText('點擊「開始遊戲」踏出第一步',cx,hy-26);
  }
}

function gameLoop(now){
  const dt=Math.max(0,(now-lastFrame)/1000);
  lastFrame=now;
  if(state==='RUNNING') advanceGame(now);
  renderTrack(now,Math.min(dt,0.1));

  if(now-lastHUD>=50){
    updateHUD();
    lastHUD=now;
  }

  if(now-lastRanking>=200){
    if(bots.length) fillRanking('ranking-body');
    lastRanking=now;
  }

  requestAnimationFrame(gameLoop);
}

pc.fillStyle='#e4eee4';
pc.fillRect(0,0,480,360);
pc.fillStyle='#5b7868';
pc.textAlign='center';
pc.font='17px system-ui';
pc.fillText('允許鏡頭後顯示動作追蹤',240,170);
pc.font='14px system-ui';
pc.fillText('也可以使用 A／D 鍵前進',240,200);

updateFullscreen();
updateHUD();
initCamera();
requestAnimationFrame(gameLoop);
</script>
